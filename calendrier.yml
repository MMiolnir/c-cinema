name: Mise a jour du calendrier

on:
  # Tous les jours a 05h15 UTC (07h15 heure de Paris en ete, 06h15 en hiver).
  # Attention : GitHub ne garantit pas l'heure exacte, un retard est normal.
  schedule:
    - cron: '15 5 * * *'
  # Ajoute un bouton "Run workflow" pour lancer une execution a la main.
  workflow_dispatch:

permissions:
  contents: write   # pour enregistrer le .ics dans le depot
  pages: write      # pour publier sur GitHub Pages
  id-token: write   # exige par l'action de deploiement

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  mise-a-jour:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Generer le fichier .ics
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python generer_calendrier.py

      # Ce commit quotidien sert aussi a garder le depot "actif" : GitHub
      # desactive les taches planifiees apres 60 jours sans activite.
      - name: Enregistrer le fichier dans le depot
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/sorties-cinema-fr.ics
          git diff --staged --quiet || git commit -m "Calendrier mis a jour ($(date -u +%F))"
          git push

      - name: Preparer GitHub Pages
        uses: actions/configure-pages@v6

      - name: Envoyer le dossier docs
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Publier
        id: deploiement
        uses: actions/deploy-pages@v5
